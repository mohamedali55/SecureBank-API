# One command to run the whole stack:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    container_name: securebank-db
    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank
    ports:
      - "5432:5432"
    volumes:
      - securebank-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebank -d securebank"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: securebank-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: securebank-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/securebank
      SPRING_DATASOURCE_USERNAME: securebank
      SPRING_DATASOURCE_PASSWORD: securebank
      # Distributed rate limiting backed by Redis.
      SECURITY_RATE_LIMIT_BACKEND: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
      # CHANGE THIS in any real deployment.
      SECURITY_JWT_SECRET: change-me-in-prod-this-is-a-development-only-secret-key-0123456789
    ports:
      - "8080:8080"
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  securebank-data:
